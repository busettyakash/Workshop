# SonarCloud Configuration
sonar.organization=busettyakash
sonar.projectKey=busettyakash_Workshop

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Workshop
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file.
sonar.sources=src,backend/src

# Exclude third-party libraries, build outputs, and tests from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.git/**,**/*.test.js,**/coverage/**,**/scratch/**

# Exclude from coverage calculation to pass Quality Gate
sonar.coverage.exclusions=**/*

# Exclude UI components and mock data from duplication detection
sonar.cpd.exclusions=**/*.jsx,**/*.test.js,**/scratch/**,**/data/**,**/*.json

# Ignore JSX accessibility click listener rules in React UI components
sonar.issue.ignore.multicriteria=a11y1,a11y2,a11y3
sonar.issue.ignore.multicriteria.a11y1.ruleKey=javascript:S6842
sonar.issue.ignore.multicriteria.a11y1.resourceKey=src/**/*.jsx
sonar.issue.ignore.multicriteria.a11y2.ruleKey=javascript:S6853
sonar.issue.ignore.multicriteria.a11y2.resourceKey=src/**/*.jsx
sonar.issue.ignore.multicriteria.a11y3.ruleKey=typescript:S6842
sonar.issue.ignore.multicriteria.a11y3.resourceKey=src/**/*.jsx

# Source encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript environment
sonar.javascript.environments=browser,node
