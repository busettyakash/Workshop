sonar.issue.ignore.multicriteria.r13.ruleKey=javascript:S5145
sonar.issue.ignore.multicriteria.r13.resourceKey=**/*.js

# Source encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript environment
sonar.javascript.environments=browser,node
