# SonarCloud Configuration
sonar.projectKey=busettyakash
sonar.organization=akash

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=Workshop
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file.
sonar.sources=src,backend/src

# Exclude third-party libraries, build outputs, and tests from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.git/**,**/*.test.js,**/coverage/**,**/scratch/**

# Source encoding
sonar.sourceEncoding=UTF-8

# JavaScript / TypeScript environment
sonar.javascript.environments=browser,node
